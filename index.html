<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
    <title>LM Chat — LM Studio</title>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- Opaque, not translucent: with "black-translucent" iOS 18 makes the web
         view the screen's height minus the status bar yet starts it at the very
         top, so the bottom 50 points can never be painted. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="LM Chat" />
    <meta name="theme-color" content="#1B1D1A" />
    <!-- iOS masks this to its own squircle, so it wants an opaque, full-bleed
         180x180 with no rounded corners of its own. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/icon-180.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
